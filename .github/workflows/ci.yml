# Test + kiểm cỡ file + build (giống `npm run gate`), chạy tay khi cần một máy sạch.
name: ci
# Từ 2026-10-26 (người học quyết): kiểm tra chạy trên máy bằng `npm run gate` trước merge; CI chỉ chạy tay.
# Đường lui: trả `on:` về pull_request + push main như lịch sử git.
on:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # features-sync.test cần origin/main để so diff
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run design:check
      - run: npm run build
