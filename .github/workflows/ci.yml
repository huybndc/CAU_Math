# Test + kiểm cỡ file + build cho mọi PR và main (trước đây CAU_Math không có CI, merge dựa vào chạy tay).
name: ci
on:
  # PR/push chỉ sửa tài liệu thì không chạy CI (tiết kiệm phút Actions; code vẫn chạy đủ)
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # features-sync.test cần origin/main để so diff
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run design:check
      - run: npm run build
