<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập · Tổng quan</title>
<script>
  try {
    const t = localStorage.getItem('study-theme');
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="/shared/style/app.css">
<link rel="stylesheet" href="/home/home.css">
</head>
<body>
<main class="home-wrap">
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối"></button>
  <div id="home"></div>
</main>
<script type="module" src="/home/home.js"></script>
</body>
</html>
