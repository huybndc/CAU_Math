<!-- ============================ CHƯƠNG 3 ============================ -->
<section class="page" id="page-ch3">

  <div class="pane" id="pane-ch3-theory">
    <div class="card theory-body" id="theory-ch3-body"></div>
  </div>

  <!-- ------------------------------ VÍ DỤ ------------------------------ -->
  <div class="pane" id="pane-ch3-example">
    <div class="card">
      <h2 data-i18n="c3.growTitle"></h2>
      <p class="hint" data-i18n="c3.growNote"></p>
      <div class="step-nav">
        <button class="btn" id="e3-prev" data-i18n="common.prev"></button>
        <button class="btn primary" id="e3-next" data-i18n="common.next"></button>
        <span class="pos" id="e3-pos"></span>
        <span class="badge" id="e3-kind"></span>
      </div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board">
          <canvas id="e3-grow"></canvas>
          <span class="hint-drag" data-i18n="c3.orbitHint"></span>
        </div>
        <div class="side">
          <div class="step" id="e3-step"></div>
          <dl class="readout" id="e3-grow-out" style="margin-top:10px"></dl>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="c3.spacesTitle"></h2>
      <p class="hint" data-i18n="c3.spacesNote"></p>
      <div class="row">
        <label class="inline"><span data-i18n="c3.preset"></span>
          <select id="e3-preset">
            <option value="rank1" data-i18n="c3.presetRank1"></option>
            <option value="rank2" selected data-i18n="c3.presetRank2"></option>
            <option value="rank3" data-i18n="c3.presetRank3"></option>
          </select>
        </label>
      </div>
      <div class="row" style="align-items:flex-start;margin-top:10px">
        <div id="e3-input"></div>
      </div>
      <div id="e3-err" class="small bad"></div>
      <div class="boardrow" style="margin-top:12px">
        <div class="board">
          <canvas id="e3-spaces"></canvas>
          <span class="hint-drag" data-i18n="c3.orbitHint"></span>
        </div>
        <div class="side">
          <dl class="readout" id="e3-spaces-out"></dl>
          <p class="small" id="e3-rank-law" style="margin:10px 0 0"></p>
          <p class="small muted" id="e3-spaces-why" style="margin:8px 0 0"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------- TƯƠNG TÁC ---------------------------- -->
  <div class="pane" id="pane-ch3-interactive">
    <div class="card">
      <h2 data-i18n="tool.space"></h2>
      <div id="tool-space"></div>
    </div>
  </div>
</section>
